name: Generate ASCII Art

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: |
          pip install Pillow

      - name: Generate ASCII SVG
        run: |
          python scripts/generate_ascii.py

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/new_ascii.svg

          git diff --cached --quiet || git commit -m "chore: update ASCII art"

          git push
