name: Update profile art

# Refreshes the contribution data + README card SVGs daily from real GitHub data.
# Runs daily, on push to main, and on-demand via workflow_dispatch.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch real contribution data (no auth needed)
        env:
          GH_PROFILE_USER: ruddro29
        run: python scripts/fetch_contributions.py

      - name: Render animated README cards
        env:
          GH_PROFILE_USER: ruddro29
        run: python scripts/render_readme_cards.py

      - name: Commit updated cards and data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution cards [skip ci]"
          file_pattern: "data/contributions.json cards/*.svg"

