      <animate
        attributeName="width"
        from="0"
        to="820"
        dur="0.65s"
        begin="0s"
        fill="freeze"/>
    </rect>
  </clipPath>

  <g clip-path="url(#line1)">

    <text
      x="40"
      y="50"
      class="ascii">

      ██████╗ ██╗   ██╗██████╗ ██████╗ ██████╗  ██████╗

    </text>

  </g>


