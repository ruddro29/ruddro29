<svg
  width="800"
  height="200"
  viewBox="0 0 800 200"
  xmlns="http://www.w3.org/2000/svg">

  <rect
    width="800"
    height="200"
    fill="#0d1117"/>

  <text
    x="400"
    y="100"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="#58a6ff"
    font-family="monospace"
    font-size="32">

    Hello, I'm Ruddro

    <animate
      attributeName="opacity"
      values="0;1;0"
      dur="3s"
      repeatCount="indefinite"/>

  </text>

</svg>
