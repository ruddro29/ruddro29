<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>README Preview</title>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 880px;
      width: 100%;
      text-align: center;
    }
    img {
      display: block;
      margin: 0;
    }
    .full {
      width: 100%;
    }
    .row {
      display: flex;
      justify-content: space-between;
      width: 100%;
    }
    .row img, .row a {
      width: 32.5%;
    }
    a {
      text-decoration: none;
    }
    .footer {
      margin-top: 24px;
      color: #8b949e;
      font-size: 14px;
    }
    .footer a {
      color: #58a6ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Hero Card -->
    <a href="https://github.com/ruddro29">
      <img src="cards/hero.svg" class="full" alt="Hero" />
    </a>

    <!-- Heatmap & Activity -->
    <img src="cards/heatmap.svg" class="full" alt="Heatmap" />
    <img src="cards/activity.svg" class="full" alt="Activity" />

    <!-- 3 World Tiles Row -->
    <div class="row">
      <a href="https://github.com/ruddro29?tab=repositories"><img src="cards/build.svg" style="width: 100%;" alt="BUILD" /></a>
      <a href="https://github.com/ruddro29?tab=repositories"><img src="cards/brand.svg" style="width: 100%;" alt="DEV" /></a>
      <a href="https://github.com/ruddro29"><img src="cards/learn.svg" style="width: 100%;" alt="STACK" /></a>
    </div>

    <!-- Section Title -->
    <picture>
      <source media="(prefers-color-scheme: dark)" srcset="cards/title-coding-dark.svg" />
      <img src="cards/title-coding-light.svg" class="full" alt="Section Title" />
    </picture>

    <!-- 3 Featured Repos Row -->
    <div class="row">
      <a href="https://github.com/ruddro29"><img src="cards/repo-Nightcode.svg" style="width: 100%;" alt="Nightcode" /></a>
      <a href="https://github.com/ruddro29"><img src="cards/repo-AI Agent.svg" style="width: 100%;" alt="AI Agent" /></a>
      <a href="https://github.com/ruddro29"><img src="cards/repo-Chess-Engine.svg" style="width: 100%;" alt="Chess-Engine" /></a>
    </div>

    <div class="footer">
      <a href="https://github.com/ruddro29">github.com/ruddro29</a> &nbsp;/&nbsp; <a href="https://x.com/ruddro29">x.com/ruddro29</a>
    </div>
  </div>
</body>
</html>
